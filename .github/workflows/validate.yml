name: Validate Bunbreak
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot version
        shell: bash
        run: |
          curl --fail --location --retry 1 --connect-timeout 10 --max-time 120 \
            -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Import clean project
        run: timeout 60 Godot_v4.6.3-stable_linux.x86_64 --headless --editor --path godot --import
      - name: Test gameplay, motion and flow
        shell: bash
        run: |
          rm -f reports/game-validation.json reports/motion-validation.json reports/flow-validation.json reports/glb-validation.json
          for suite in validate_game validate_motion validate_flow; do
            timeout 45 Godot_v4.6.3-stable_linux.x86_64 --headless --path godot --script tests/$suite.gd
          done
          set -o pipefail
          timeout 45 Godot_v4.6.3-stable_linux.x86_64 --headless --path godot --script tests/validate_fruit_assets.gd | tee /tmp/fruit-check.log
          grep -F 'FRUIT ASSET RUNTIME PASS' /tmp/fruit-check.log
          python3 authoring/validate_glb.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ['game-validation', 'motion-validation', 'flow-validation', 'glb-validation']:
              result = json.loads(Path('reports', name + '.json').read_text())
              assert result['passed'], (name, result)
          PY
      - name: Validate browser physics and six level solutions
        run: node --test web/tests/*.test.mjs
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunbreak-validation
          path: reports/*.json

  browser-motion-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser review dependencies
        run: python3 -m pip install --user playwright pillow
      - name: Render mobile controls and animation sequences
        shell: bash
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 4173 --directory web/dist >/tmp/bunbreak-server.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          timeout 120 python3 web/tests/mobile_layout.py
          timeout 120 python3 web/tests/pointer_feedback.py
          timeout 180 python3 web/tests/recovery_browser.py
          timeout 600 python3 web/tests/animation_sequence.py
          timeout 300 python3 web/tests/tactile_review.py after
          timeout 300 python3 web/tests/teardrop_review.py after
      - name: Retain actual rendered animation frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunbreak-browser-frames
          path: |
            reports/animation-sequence/
            reports/tactile-review/after/
            reports/teardrop-review/after/
          if-no-files-found: ignore
