name: Validate Bunbreak
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot version
        shell: bash
        run: |
          curl --fail --location --retry 1 --connect-timeout 10 --max-time 120 \
            -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Import clean project
        run: timeout 60 Godot_v4.6.3-stable_linux.x86_64 --headless --editor --path godot --import
      - name: Test gameplay, motion and flow
        shell: bash
        run: |
          rm -f reports/game-validation.json reports/motion-validation.json reports/flow-validation.json reports/glb-validation.json
          for suite in validate_game validate_motion validate_flow; do
            timeout 45 Godot_v4.6.3-stable_linux.x86_64 --headless --path godot --script tests/$suite.gd
          done
          python3 authoring/validate_glb.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ['game-validation', 'motion-validation', 'flow-validation', 'glb-validation']:
              result = json.loads(Path('reports', name + '.json').read_text())
              assert result['passed'], (name, result)
          PY
      - name: Validate browser physics and six level solutions
        run: node --test web/tests/*.test.mjs
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunbreak-validation
          path: reports/*.json
